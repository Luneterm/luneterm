[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/luneterm"]

[workspace.package]
version = "0.9.0"
edition = "2024"
rust-version = "1.90"
publish = false
license = "Apache-2.0"

[workspace.dependencies]
lune-vt = { path = "crates/lune-vt" }
lune-pty = { path = "crates/lune-pty" }
lune-ui = { git = "https://github.com/lune-rs/luneui", rev = "8177b9d0175218d4ae5862d34b2184d8d8381bd5" }
lune-termview = { path = "crates/lune-termview" }
# The update client (auto-update plan step 2; CLAUDE.md decision 2 note in step 7). One pinned rev, held by scripts/check-deps.sh.
lunepack = { git = "https://github.com/lune-rs/lunepack", rev = "be29be066341c52a1af95f9f6d7d30cabe2cba35" }
# Test-only (crates/luneterm update tests): the writers that build a signed fixture feed at test time, from the same repo and rev.
lunepack-testkit = { git = "https://github.com/lune-rs/lunepack", rev = "be29be066341c52a1af95f9f6d7d30cabe2cba35" }
lunepack-core = { git = "https://github.com/lune-rs/lunepack", rev = "be29be066341c52a1af95f9f6d7d30cabe2cba35" }
lunepack-crypto = { git = "https://github.com/lune-rs/lunepack", rev = "be29be066341c52a1af95f9f6d7d30cabe2cba35" }
lunepack-codec-lzma = { git = "https://github.com/lune-rs/lunepack", rev = "be29be066341c52a1af95f9f6d7d30cabe2cba35" }
lunepack-fs = { git = "https://github.com/lune-rs/lunepack", rev = "be29be066341c52a1af95f9f6d7d30cabe2cba35" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
# MSRV 1.90 (lunepack needs it) turned these two on for old code. Ported lune-vt files mirror upstream xterm.js nesting and arithmetic; rewriting them would churn files that must stay close to the source.
collapsible_if = "allow"
manual_is_multiple_of = "allow"

# Shipping build: small and fast. Terminal throughput matters, so opt-level stays 3.
[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# The shipping build of the C ABI library: `cargo build -p luneterm-ffi --profile ffi-release`.
# Release, but unwinding, so `catch_unwind` can keep a panic from crossing into the host (program
# D18, M8 D4); profiles cannot be set per package. luneterm-ffi refuses `panic = "abort"`.
[profile.ffi-release]
inherits = "release"
panic = "unwind"

# Size experiments only (`cargo build --profile min-size`); measure throughput before adopting.
[profile.min-size]
inherits = "release"
opt-level = "z"
