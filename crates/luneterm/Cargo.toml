[package]
name = "luneterm"
description = "Luneterm: a standalone glass terminal for Windows, macOS and Linux"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
lune-vt.workspace = true
lune-pty.workspace = true
lune-ui.workspace = true
lune-termview.workspace = true
# Versions as the toolkit's lock resolves them (winit 0.30, wgpu 30); the facade re-exports neither.
winit = "0.30"
wgpu = "30"
pollster = "0.4"
# The platform config directory for settings.json and workspace.json (plan M10 D17).
dirs = "6"

# `geteuid` for the shell-integration directory's owner check (shell_integration/mod.rs); already
# in the lock through winit and the toolkit.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The tab-switch trace's OS event timestamps (os_event.rs, trace-only); the same versions and
# features the toolkit's own AppKit code already builds, plus `NSGraphicsContext` for
# `mouseEventWithType:` (the trace's synthetic clicks). No new package in the lock.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSDate", "NSGeometry", "NSProcessInfo"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSEvent", "NSGraphicsContext", "NSResponder", "NSView", "NSWindow"] }

# `ShellExecuteW` to open a link (links/open.rs, D4): the one Windows API the app calls itself.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

# The DLL-search test (tests/dll_search_gpu.rs) loads and inspects modules.
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_LibraryLoader"] }

[lints]
workspace = true

[[test]]
name = "dll_search_gpu"
harness = false

# The end-to-end harness: real PTY children, re-run as the child (tests/e2e/child.rs).
[[test]]
name = "e2e"
harness = false
