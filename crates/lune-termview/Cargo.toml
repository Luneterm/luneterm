[package]
name = "lune-termview"
description = "Renderer: glyph atlas, cell grid and glass layer compositing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
lune-ui.workspace = true
wgpu = "30"
bytemuck = { version = "1", features = ["derive"] }
cosmic-text = "0.19"
fontdb = { version = "0.23", default-features = false }
etagere = "0.3"
zeno = { version = "0.3.3", default-features = false, features = ["eval"] }

[dev-dependencies]
pollster = "0.4"
png = "0.18"
unicode-script = "0.5"

[lints]
workspace = true
