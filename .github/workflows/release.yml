name: release

# A version tag builds the Windows and Linux BUILD INPUTS and creates a DRAFT release. A build input
# is not a user download: it is the app plus lunepack's runtime for the target, in the layout
# scripts/make-build-input.py writes (BUILD-INFO.txt names the parts). A person then adds the macOS
# build input (scripts/package-macos.sh <tag>, there is no macOS runner), checks the draft and
# publishes it; publishing starts the publish-updates workflow (auto-update plan step 6), which
# packs the inputs into the signed update feed and the installers. The runbook is under Commands
# in CLAUDE.md.
#
# No secret is used here: the release signing key belongs to the publish-updates workflow only.
#
# v<version> is the release, v<version>-rc.<N> a rehearsal of the same path (a prerelease draft).
# Runners and their images: see ci.yml.
on:
  push:
    tags: ["v[0-9]*"]

# Only the publish job can write. Build jobs run the project's build on a VM that persists between
# jobs, so they hold a read-only token.
permissions:
  contents: read

env:
  TAG: ${{ github.ref_name }}

jobs:
  verify:
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The tag names this version and a commit on main
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "tag $TAG is not v<major>.<minor>.<patch> or v<major>.<minor>.<patch>-rc.<N>" >&2
            exit 1
          fi
          version="${TAG#v}"
          version="${version%%-rc.*}"
          cargo_version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          if [ "$version" != "$cargo_version" ]; then
            echo "tag $TAG does not match the workspace version $cargo_version in Cargo.toml" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "tag $TAG is not on main" >&2
            exit 1
          fi

  linux:
    needs: verify
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # As check-linux in ci.yml: the image has no compiler or Rust.
      - name: Install build tools and rustup
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(id -u)" = 0 ]; then SUDO=""; else SUDO="sudo"; fi
          $SUDO apt-get update
          # musl-tools: lunepack's runtime is a static musl binary.
          $SUDO apt-get install -y --no-install-recommends build-essential pkg-config procps musl-tools
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - run: cargo build --release --locked -p luneterm
      # lunepack's runtime and update window UI, built from the source at the pinned revision
      # (scripts/build-lunepack.sh checks its dependencies come from crates.io).
      - name: Build the lunepack runtime
        run: scripts/build-lunepack.sh linux-x86_64 lunepack-out
      # What the binary links, and the glibc it needs (the app's and the update window's, the
      # higher of the two): the release notes state the floor.
      - name: Measure and package
        shell: bash
        run: |
          set -euo pipefail
          bin=target/release/luneterm
          ui=lunepack-out/lunepack-ui
          readelf -d "$bin" | grep NEEDED
          glibc="$(for f in "$bin" "$ui"; do objdump -T "$f" | grep -o 'GLIBC_[0-9][0-9.]*' | sed 's/^GLIBC_//'; done | sort -V | tail -n 1)"
          if [ -z "$glibc" ]; then
            echo "no GLIBC_ version found in $bin or $ui" >&2
            exit 1
          fi
          echo "highest required glibc: $glibc"
          version="${TAG#v}"
          stage=build-input
          mkdir -p "$stage/tree" "$stage/lunepack" dist
          cp "$bin" "$stage/tree/luneterm"
          cp -R licenses "$stage/tree/licenses"
          cp assets/icon/luneterm-256.png "$stage/tree/luneterm-256.png"
          cp lunepack-out/lunepack-runtime lunepack-out/lunepack-ui "$stage/lunepack/"
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct HEAD)"
          export SOURCE_DATE_EPOCH
          cat > "$stage/BUILD-INFO.txt" <<INFO
          format=1
          version=$version
          target=linux-x86_64
          config=packaging/lunepack-linux.toml
          entry=luneterm
          tree=tree
          runtime=lunepack/lunepack-runtime
          ui=lunepack/lunepack-ui
          lunepack_rev=$(cat lunepack-out/lunepack-rev.txt)
          source_date_epoch=$SOURCE_DATE_EPOCH
          glibc_min=$glibc
          INFO
          python3 -I scripts/make-build-input.py "$stage" "dist/luneterm-$version-linux-x64-build.tar.gz"
          printf '%s\n' "$glibc" > dist/glibc-min.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-linux
          path: dist
          retention-days: 7
          if-no-files-found: error

  # Accepted risk while the repo and its releases are private: this job builds on the shared VM,
  # which persists between jobs, so a compromised VM could taint the exe. Decide this again before
  # the repo or any release goes public.
  windows:
    needs: verify
    runs-on: [self-hosted, windows, x64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Rust toolchain
        shell: powershell
        run: |
          # The VM has Windows PowerShell 5.1 only (no pwsh): TLS 1.2 is asked for by hand.
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $bin = Join-Path $HOME ".cargo\bin"
          $env:PATH = "$bin;$env:PATH"
          if (-not (Get-Command rustup -ErrorAction SilentlyContinue)) {
            Invoke-WebRequest https://win.rustup.rs/x86_64 -OutFile rustup-init.exe
            .\rustup-init.exe -y --default-toolchain none --profile minimal
            Remove-Item rustup-init.exe
          }
          Add-Content -Path $env:GITHUB_PATH -Value $bin
          rustup toolchain install
      # The CRT is linked in: the zip must run on a machine without the VC++ redistributable.
      - shell: powershell
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release --locked -p luneterm
      # lunepack's runtime, launcher stub and update window UI, built from the source at the pinned
      # revision (its own toolchain and rustflags: not in the step above, whose RUSTFLAGS would
      # replace lunepack's).
      - name: Build the lunepack runtime
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $env:PATH = "$(Join-Path $HOME '.cargo\bin');$env:PATH"
          .\scripts\build-lunepack.ps1 -OutDir lunepack-out
      # tree\ (luneterm.exe, licenses\) is what lunepack packs; lunepack\ holds what it places
      # beside it. ZipFile rather than Compress-Archive, whose 5.1 version writes backslashes into
      # the entry names.
      - name: Package
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $version = $env:TAG.Substring(1)
          New-Item -ItemType Directory dist, stage, stage/tree, stage/lunepack | Out-Null
          Copy-Item target/release/luneterm.exe stage/tree/luneterm.exe
          Copy-Item -Recurse licenses stage/tree/licenses
          foreach ($f in 'lunepack-runtime.exe', 'lunepack-stub.exe', 'lunepack-ui.exe') {
            Copy-Item "lunepack-out/$f" "stage/lunepack/$f"
          }
          $epoch = (git log -1 --format=%ct HEAD).Trim()
          if ($epoch -notmatch '^[0-9]+$') { throw "cannot read the commit time of HEAD" }
          $rev = (Get-Content lunepack-out/lunepack-rev.txt -Raw).Trim()
          $info = @(
            "format=1", "version=$version", "target=windows-x86_64",
            "config=packaging/lunepack-windows.toml", "entry=luneterm.exe", "tree=tree",
            "runtime=lunepack/lunepack-runtime.exe", "stub=lunepack/lunepack-stub.exe",
            "ui=lunepack/lunepack-ui.exe", "lunepack_rev=$rev", "source_date_epoch=$epoch"
          ) -join "`n"
          [IO.File]::WriteAllText((Join-Path (Resolve-Path stage).Path "BUILD-INFO.txt"), "$info`n")
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = Join-Path (Resolve-Path dist) "luneterm-$version-windows-x64-build.zip"
          [IO.Compression.ZipFile]::CreateFromDirectory((Resolve-Path stage).Path, $zip)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-windows
          path: dist
          retention-days: 7
          if-no-files-found: error

  # A single-use Linux container, never the Windows VM: the only job with a write token.
  publish:
    needs: [verify, linux, windows]
    runs-on: [self-hosted, linux, x64]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # By name into separate directories: one job's upload cannot overwrite another's files.
      # v8.0.2 or newer, not v4: v4's unzip-stream lets an entry like a/../../../x escape the path and
      # replace files this job then runs with the write token. A build job controls these zips.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-linux
          path: dist/linux
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-windows
          path: dist/windows
      # The draft holds only build inputs (and their checksums); the macOS one is added by
      # scripts/package-macos.sh. Publishing the draft starts publish-updates.
      - name: Create the draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/publish-release.py "$TAG" dist docs/release-notes.md
