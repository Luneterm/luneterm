name: ci

on:
  push:
    branches: [main, "orch/**", "spike/**"]
  pull_request:
  workflow_dispatch:

# Runners (2026-11-09: GitHub-hosted runners are blocked by account billing, so CI is self-hosted;
# infra/runners/README.md has both autoscalers):
#   linux   - the gha-autoscaler: one single-use Debian container per job, labels self-hosted, linux,
#             x64. The image has git, python3 and curl but no Rust or C toolchain, so the job installs
#             them. Local equivalent: scripts/check-linux.sh (Docker).
#   windows - the second autoscaler (claude-win-vm, labels self-hosted, windows, x64; the autoscaler
#             serves only those labels, so a job that asks for `luneterm-win` would queue forever).
#             Each job runs as the non-admin local user `ghrunner` in a fresh runner directory, at most
#             2 at once, with no desktop session (nothing here drives a window). Tools installed on the
#             VM persist between jobs; the jobs install the pinned Rust toolchain if it is missing.
#             Back on 2026-11-09; the last green Windows CI before that was e35e540.
#   macOS   - no runner: scripts/check-macos.sh is the local gate (fmt, clippy, tests, check-ffi.sh).
# The repo is private. A Windows job stays off pull requests from forks (the `if` conditions below);
# the Linux containers are single-use.
jobs:
  check-linux:
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
      # The runner image is Debian trixie-slim as root: no compiler, linker or procps. Rust comes
      # from rustup (--default-toolchain none: rust-toolchain.toml pins the version, and rustup
      # 1.28+ does not install it on the first cargo call, so the next step does).
      - name: Install build tools and rustup
        run: |
          if [ "$(id -u)" = 0 ]; then SUDO=""; else SUDO="sudo"; fi
          $SUDO apt-get update
          $SUDO apt-get install -y --no-install-recommends build-essential pkg-config procps
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - run: cargo fmt --all -- --check
      - run: scripts/check-lib-boundaries.sh
      # M9 D18: every package comes from this repo, crates.io or the pinned luneui-rs rev.
      - run: scripts/check-deps.sh
      # M10 D11: licenses/THIRD_PARTY_CRATES.txt is what `cargo metadata --locked` says ships
      # (four targets), with every package's text; fails on a stale, incomplete or unknown-id bundle.
      - run: python3 scripts/gen-licenses.py --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      # M3 D10: lune-pty flake detector, 5 consecutive runs; stops at the first failure.
      - name: lune-pty soak (5x)
        run: |
          for i in 1 2 3 4 5; do
            echo "lune-pty soak run $i"
            cargo test -p lune-pty --locked || exit 1
          done
      # cargo test captures stdout; --nocapture puts the P6 adapter / P4 emoji probe lines in the log.
      - run: cargo test -p lune-termview --locked --test probe -- --nocapture

  check-windows:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, windows, x64]
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        shell: pwsh
        run: |
          $bin = Join-Path $HOME ".cargo\bin"
          $env:PATH = "$bin;$env:PATH"
          if (-not (Get-Command rustup -ErrorAction SilentlyContinue)) {
            Invoke-WebRequest https://win.rustup.rs/x86_64 -OutFile rustup-init.exe
            .\rustup-init.exe -y --default-toolchain none --profile minimal
            Remove-Item rustup-init.exe
          }
          Add-Content -Path $env:GITHUB_PATH -Value $bin
          # rust-toolchain.toml pins the version; rustup 1.28+ installs it only when asked.
          rustup toolchain install
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      # M8 D8: header == exported symbols (nm vs the clang AST): macOS only (scripts/check-macos.sh).
      # Windows checks the DLL builds (job windows-exe) and the Rust tests.
      # M3 D10: lune-pty flake detector, 5 consecutive runs; stops at the first failure.
      - name: lune-pty soak (5x)
        shell: bash
        run: |
          for i in 1 2 3 4 5; do
            echo "lune-pty soak run $i"
            cargo test -p lune-pty --locked || exit 1
          done
      # cargo test captures stdout; --nocapture puts the P6 adapter / P4 emoji probe lines in the log.
      - run: cargo test -p lune-termview --locked --test probe -- --nocapture

  # Windows build for testing on real hardware: the app, luneterm.exe (M9).
  windows-exe:
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, windows, x64]
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        shell: pwsh
        run: |
          $bin = Join-Path $HOME ".cargo\bin"
          $env:PATH = "$bin;$env:PATH"
          if (-not (Get-Command rustup -ErrorAction SilentlyContinue)) {
            Invoke-WebRequest https://win.rustup.rs/x86_64 -OutFile rustup-init.exe
            .\rustup-init.exe -y --default-toolchain none --profile minimal
            Remove-Item rustup-init.exe
          }
          Add-Content -Path $env:GITHUB_PATH -Value $bin
          rustup toolchain install
      # M3 step 0 (P7/P8): the spawn example's size, for the portable-pty cost record.
      - run: cargo build --release --locked -p lune-pty --example spawn
      # M9 step 7: the app. GUI subsystem in release; the artifact below is this file.
      - run: cargo build --release --locked -p luneterm
      # M8 D4: the C ABI library is built only with the ffi-release profile (unwinding).
      - run: cargo build --locked -p luneterm-ffi --profile ffi-release
      - shell: pwsh
        run: |
          $dll = (Get-Item target/ffi-release/luneterm_ffi.dll).Length
          "luneterm_ffi.dll=$dll"
      - shell: pwsh
        run: |
          $spawn = (Get-Item target/release/examples/spawn.exe).Length
          $app = (Get-Item target/release/luneterm.exe).Length
          "luneterm.exe=$app spawn.exe=$spawn"
      # The exe and the licences it must travel with (M10 step 10): luneterm.exe stays at the
      # artifact's root, licenses/ beside it.
      - shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/release/luneterm.exe dist/luneterm.exe
          Copy-Item -Recurse licenses dist/licenses
      - uses: actions/upload-artifact@v4
        with:
          name: luneterm-windows-x64
          path: dist
          retention-days: 7
          if-no-files-found: error
