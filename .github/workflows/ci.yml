name: ci

on:
  push:
    branches: [main, "orch/**", "spike/**"]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins the toolchain; rustup installs it on first cargo call.
      - run: cargo fmt --all -- --check
      - if: runner.os == 'Linux'
        run: scripts/check-lib-boundaries.sh
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # cargo test captures stdout; --nocapture puts the P6 adapter / P4 emoji probe lines in the log.
      - run: cargo test -p lune-termview --test probe -- --nocapture

  # Windows build for testing on real hardware. M9 adds luneterm.exe here.
  windows-exe:
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins the toolchain; rustup installs it on first cargo call.
      - run: cargo build --release -p glass-ui
      # M3 step 0 (P7/P8): portable-pty size cost = spawn example minus the luneterm placeholder.
      - run: cargo build --release -p lune-pty --example spawn
      - run: cargo build --release -p luneterm
      - shell: pwsh
        run: |
          $spawn = (Get-Item target/release/examples/spawn.exe).Length
          $base = (Get-Item target/release/luneterm.exe).Length
          "spawn.exe=$spawn luneterm.exe=$base delta=$($spawn - $base)"
      - uses: actions/upload-artifact@v4
        with:
          name: glass-ui-windows-x64
          path: target/release/glass-ui.exe
          retention-days: 7
          if-no-files-found: error
