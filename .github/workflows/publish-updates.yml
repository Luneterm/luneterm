name: publish-updates

# Packs a published release's build inputs, publishes them to the signed update feed on R2 with
# `lunepack publish`, and attaches the installers. The flow is lunepack's own (its docs/PUBLISHING.md,
# the same one Whipspot uses); docs/updates.md here is the runbook (environments, tokens, key ceremony).
#
#   tools-linux  builds the lunepack CLI from the pin of Cargo.toml and reports its SHA-256; no secret
#   pack         (environment release-pack)  release-pack.py pack: build inputs from the release, then
#                `publish fetch`, `pack` and `setup` for the three targets; holds the release key only
#   push         (environment release-push)  the OWNER APPROVES here: `publish push --dry-run`, then
#                `publish push`; holds the release key and the push token
#   attach       (no environment; GITHUB_TOKEN with contents: write only) the setup files to the release
#   drop-artifacts (no environment; GITHUB_TOKEN with actions: write, plus contents: read for the checkout)
#                after every job that downloads an artifact has succeeded: deletes this run's lunepack-cli,
#                release and setup artifacts (release-pack.py drop-artifacts)
#   refresh      (environment release-refresh, default branch only) re-signs feeds that expire soon;
#                holds the release key and the two refresh tokens (public: read and write; private: read)
#   drop         (environment release-push) takes one release out of the feeds and deletes its objects
#
# Every job that holds a secret checks the CLI against the SHA-256 that tools-linux reported before its
# first lunepack call, and none of them builds anything: a key job only runs that checked CLI and this
# repository's Python (standard library only, no third-party code). No repository secret is read: the
# release key, the account id and the three R2 tokens are secrets of the three environments, so a run on
# a branch gets none of them. The environments (their ref rules and reviewers) are made before any secret
# is added (docs/updates.md).
#
#   release published  -> pack, push (owner approves) and attach for that tag; this is an apply run
#   workflow_dispatch  -> mode refresh (all feeds), publish (run from a v* tag ref: pack, push, attach)
#                         or drop (run from a v* tag ref; drop_version); dry_run (default) runs only the
#                         `--dry-run` commands and attaches nothing
#   schedule (weekly)  -> refresh the feeds that expire within 30 days; nothing while nothing is published
#
# Not live until the owner says so: every job runs only when the repository variable PUBLISH_READY is
# 'true'; until then a run ends green with a notice.
#
# Recovery: once `publish push` has written a feed, `publish fetch` refuses that version, so a new run
# cannot rebuild the setup files. The run's artifacts (the CLI, the release directory, the setup files)
# are kept 14 days, and deleted by drop-artifacts once the run succeeded; a failed push or attach is
# finished by "re-run failed jobs" of the same run within that window (docs/updates.md). A push can
# wait up to 14 days for the owner's approval.
#
# Runners and their images: see ci.yml. The jobs run on the self-hosted Linux runner (never the
# Windows VM). Whether a job's container is fresh is not checked here (docs/updates.md, "Runner").
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      mode:
        description: "refresh the feeds, publish a release (run from its v* tag) or drop one (run from a v* tag)"
        type: choice
        options: [refresh, publish, drop]
        default: refresh
      drop_version:
        description: "drop: the version to take out of the feeds, <major>.<minor>.<patch>[-rc.<N>]"
        type: string
        default: ""
      dry_run:
        description: "run only the --dry-run commands and attach nothing"
        type: boolean
        default: true
  schedule:
    - cron: "23 5 * * 1"

permissions:
  contents: read

# One publisher at a time: two runs would race on the feeds and the publisher state file.
concurrency:
  group: publish-updates
  cancel-in-progress: false

env:
  # The release's tag (a dispatch from a tag ref names it in the ref). Never put into a script's text.
  TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref_name }}
  # A release event is an apply run; a dispatch is a dry run unless asked otherwise.
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}

jobs:
  not-ready:
    if: vars.PUBLISH_READY != 'true'
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Say so
        run: |
          echo "::notice::Publishing is not live (the repository variable PUBLISH_READY is not 'true', see docs/updates.md). Nothing was published."

  tools-linux:
    if: vars.PUBLISH_READY == 'true'
    runs-on: [self-hosted, linux, x64]
    outputs:
      cli_sha256: ${{ steps.hash.outputs.cli_sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # As release.yml: the image has no compiler or Rust. No secret and no environment here: this is
      # the only job that compiles, and it holds nothing to steal.
      - name: Install build tools and rustup
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(id -u)" = 0 ]; then SUDO=""; else SUDO="sudo"; fi
          $SUDO apt-get update
          $SUDO apt-get install -y --no-install-recommends build-essential pkg-config
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      # The lunepack CLI at the revision Cargo.toml pins (its dependency graph is checked first).
      - name: Build the lunepack CLI
        shell: bash
        run: scripts/build-lunepack.sh cli-linux-x86_64 "$RUNNER_TEMP/lunepack-cli"
      - name: Its SHA-256
        id: hash
        shell: bash
        run: |
          set -euo pipefail
          echo "cli_sha256=$(sha256sum "$RUNNER_TEMP/lunepack-cli/lunepack" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lunepack-cli
          path: ${{ runner.temp }}/lunepack-cli/lunepack
          # A publish run's push waits for the owner and can be re-run: it needs the CLI that long. A
          # refresh or drop run (weekly) keeps it a day.
          retention-days: ${{ (github.event_name == 'release' || inputs.mode == 'publish') && 14 || 1 }}

  pack:
    if: vars.PUBLISH_READY == 'true' && (github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'publish'))
    needs: [tools-linux]
    runs-on: [self-hosted, linux, x64]
    environment: release-pack      # v* tags only; the release key lives here
    permissions:
      contents: read               # the build inputs are downloaded with this token
    outputs:
      setup_sha256_linux_x86_64: ${{ steps.pack.outputs.setup_sha256_linux_x86_64 }}
      setup_sha256_windows_x86_64: ${{ steps.pack.outputs.setup_sha256_windows_x86_64 }}
      setup_sha256_macos_aarch64: ${{ steps.pack.outputs.setup_sha256_macos_aarch64 }}
    steps:
      - name: Check the tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "'$TAG' is not v<major>.<minor>.<patch> or v<major>.<minor>.<patch>-rc.<N>" >&2
            exit 1
          fi
      # The tag's own commit: its packaging config and its pin are what the build inputs were made with.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: refs/tags/${{ env.TAG }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lunepack-cli
          path: ${{ runner.temp }}/tools
      - name: Check the CLI against tools-linux
        shell: bash
        env:
          WANT: ${{ needs.tools-linux.outputs.cli_sha256 }}
        run: |
          set -euo pipefail
          # The tools dir must hold the CLI alone (lunepack PUBLISHING.md: no planted file beside it).
          shopt -s nullglob dotglob; FILES=("$RUNNER_TEMP"/tools/*); shopt -u nullglob dotglob
          if [ "${#FILES[@]}" -ne 1 ] || [ "${FILES[0]}" != "$RUNNER_TEMP/tools/lunepack" ] || [ ! -f "${FILES[0]}" ] || [ -L "${FILES[0]}" ]; then echo "lunepack-cli holds more than the CLI" >&2; exit 1; fi
          GOT="$(sha256sum "$RUNNER_TEMP/tools/lunepack" | cut -d' ' -f1)"
          if [ -z "$WANT" ] || [ "$GOT" != "$WANT" ]; then echo "the CLI is not the one tools-linux built" >&2; exit 1; fi
          chmod +x "$RUNNER_TEMP/tools/lunepack"
      - name: Pack the build inputs and set up
        id: pack
        shell: bash
        env:
          LUNEPACK_RELEASE_KEY: ${{ secrets.LUNEPACK_RELEASE_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +x
          set -euo pipefail
          python3 -I scripts/release-pack.py pack --tag "$TAG" --lunepack "$RUNNER_TEMP/tools/lunepack" \
            --config packaging/lunepack.toml --work "$RUNNER_TEMP/pack" --output-file "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release
          path: ${{ runner.temp }}/pack/release
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: setup
          path: ${{ runner.temp }}/pack/setup
          retention-days: 14

  push:
    if: vars.PUBLISH_READY == 'true' && (github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'publish'))
    needs: [tools-linux, pack]
    runs-on: [self-hosted, linux, x64]
    environment: release-push      # v* tags only; the owner approves here; the release key and the push token live here
    steps:
      - name: Check the tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "'$TAG' is not v<major>.<minor>.<patch> or v<major>.<minor>.<patch>-rc.<N>" >&2
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: refs/tags/${{ env.TAG }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lunepack-cli
          path: ${{ runner.temp }}/tools
      - name: Check the CLI against tools-linux
        shell: bash
        env:
          WANT: ${{ needs.tools-linux.outputs.cli_sha256 }}
        run: |
          set -euo pipefail
          # The tools dir must hold the CLI alone (lunepack PUBLISHING.md: no planted file beside it).
          shopt -s nullglob dotglob; FILES=("$RUNNER_TEMP"/tools/*); shopt -u nullglob dotglob
          if [ "${#FILES[@]}" -ne 1 ] || [ "${FILES[0]}" != "$RUNNER_TEMP/tools/lunepack" ] || [ ! -f "${FILES[0]}" ] || [ -L "${FILES[0]}" ]; then echo "lunepack-cli holds more than the CLI" >&2; exit 1; fi
          GOT="$(sha256sum "$RUNNER_TEMP/tools/lunepack" | cut -d' ' -f1)"
          if [ -z "$WANT" ] || [ "$GOT" != "$WANT" ]; then echo "the CLI is not the one tools-linux built" >&2; exit 1; fi
          chmod +x "$RUNNER_TEMP/tools/lunepack"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: ${{ runner.temp }}/release
      - name: Push (a dry run first)
        shell: bash
        env:
          LUNEPACK_RELEASE_KEY: ${{ secrets.LUNEPACK_RELEASE_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          # One push token (public: read, write, delete; private: read, write) for both pairs.
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_PRIVATE_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_PRIVATE_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set +x
          set -euo pipefail
          CLI="$RUNNER_TEMP/tools/lunepack"
          VERSION="${TAG#v}"
          "$CLI" publish push --release-dir "$RUNNER_TEMP/release" --version "$VERSION" \
            --sign release --config packaging/lunepack.toml --dry-run
          if [ "$DRY_RUN" = "true" ]; then
            echo "dry run: nothing pushed"
            exit 0
          fi
          "$CLI" publish push --release-dir "$RUNNER_TEMP/release" --version "$VERSION" \
            --sign release --config packaging/lunepack.toml

  attach:
    if: vars.PUBLISH_READY == 'true' && (github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'publish' && !inputs.dry_run))
    needs: [pack, push]
    runs-on: [self-hosted, linux, x64]
    permissions:
      contents: write              # the release's assets; no environment and no other secret
    steps:
      - name: Check the tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "'$TAG' is not v<major>.<minor>.<patch> or v<major>.<minor>.<patch>-rc.<N>" >&2
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: refs/tags/${{ env.TAG }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: setup
          path: ${{ runner.temp }}/setup
      - name: Attach the setup files and remove the build inputs
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SHA_LINUX: ${{ needs.pack.outputs.setup_sha256_linux_x86_64 }}
          SHA_WINDOWS: ${{ needs.pack.outputs.setup_sha256_windows_x86_64 }}
          SHA_MACOS: ${{ needs.pack.outputs.setup_sha256_macos_aarch64 }}
        run: |
          set +x
          set -euo pipefail
          python3 -I scripts/release-pack.py attach --tag "$TAG" --dir "$RUNNER_TEMP/setup" \
            --expect "linux-x86_64=$SHA_LINUX" "windows-x86_64=$SHA_WINDOWS" "macos-aarch64=$SHA_MACOS"

  # The run's artifacts are not needed once every job that downloads one has succeeded. If one of those
  # jobs failed, nothing is deleted: a re-run still finds them, and they expire after 14 days.
  drop-artifacts:
    if: vars.PUBLISH_READY == 'true' && (github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'publish' && !inputs.dry_run))
    needs: [attach]
    runs-on: [self-hosted, linux, x64]
    permissions:
      actions: write               # delete this run's artifacts; no environment and no other secret
      contents: read               # the checkout
    steps:
      - name: Check the tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "'$TAG' is not v<major>.<minor>.<patch> or v<major>.<minor>.<patch>-rc.<N>" >&2
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: refs/tags/${{ env.TAG }}
      - name: Delete this run's artifacts
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +x
          set -euo pipefail
          python3 -I scripts/release-pack.py drop-artifacts --run-id "$GITHUB_RUN_ID"

  refresh:
    if: vars.PUBLISH_READY == 'true' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'refresh'))
    needs: [tools-linux]
    runs-on: [self-hosted, linux, x64]
    environment: release-refresh   # the default branch only; the release key and the two refresh tokens live here
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lunepack-cli
          path: ${{ runner.temp }}/tools
      - name: Check the CLI against tools-linux
        shell: bash
        env:
          WANT: ${{ needs.tools-linux.outputs.cli_sha256 }}
        run: |
          set -euo pipefail
          # The tools dir must hold the CLI alone (lunepack PUBLISHING.md: no planted file beside it).
          shopt -s nullglob dotglob; FILES=("$RUNNER_TEMP"/tools/*); shopt -u nullglob dotglob
          if [ "${#FILES[@]}" -ne 1 ] || [ "${FILES[0]}" != "$RUNNER_TEMP/tools/lunepack" ] || [ ! -f "${FILES[0]}" ] || [ -L "${FILES[0]}" ]; then echo "lunepack-cli holds more than the CLI" >&2; exit 1; fi
          GOT="$(sha256sum "$RUNNER_TEMP/tools/lunepack" | cut -d' ' -f1)"
          if [ -z "$WANT" ] || [ "$GOT" != "$WANT" ]; then echo "the CLI is not the one tools-linux built" >&2; exit 1; fi
          chmod +x "$RUNNER_TEMP/tools/lunepack"
      - name: Refresh the feeds
        shell: bash
        env:
          LUNEPACK_RELEASE_KEY: ${{ secrets.LUNEPACK_RELEASE_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          # The public bucket: read and write. The private bucket: read only (a refresh that could
          # write the state file could lower its record and defeat the rollback guard).
          R2_ACCESS_KEY_ID: ${{ secrets.R2_REFRESH_PUBLIC_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_REFRESH_PUBLIC_SECRET_ACCESS_KEY }}
          R2_PRIVATE_ACCESS_KEY_ID: ${{ secrets.R2_REFRESH_PRIVATE_ACCESS_KEY_ID }}
          R2_PRIVATE_SECRET_ACCESS_KEY: ${{ secrets.R2_REFRESH_PRIVATE_SECRET_ACCESS_KEY }}
        run: |
          set +x
          set -euo pipefail
          args=(publish refresh --sign release --config packaging/lunepack.toml)
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            args+=(--if-expiring-within-days 30 --skip-if-unpublished)
          elif [ "$DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          fi
          "$RUNNER_TEMP/tools/lunepack" "${args[@]}"

  drop:
    if: vars.PUBLISH_READY == 'true' && github.event_name == 'workflow_dispatch' && inputs.mode == 'drop'
    needs: [tools-linux]
    runs-on: [self-hosted, linux, x64]
    environment: release-push      # run from a v* tag; the owner approves, as for push
    steps:
      - name: Check the version to drop
        shell: bash
        env:
          DROP_VERSION: ${{ inputs.drop_version }}   # through the environment, never into the script text
        run: |
          set -euo pipefail
          if [[ ! "$DROP_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "'$DROP_VERSION' is not <major>.<minor>.<patch> or <major>.<minor>.<patch>-rc.<N>" >&2
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lunepack-cli
          path: ${{ runner.temp }}/tools
      - name: Check the CLI against tools-linux
        shell: bash
        env:
          WANT: ${{ needs.tools-linux.outputs.cli_sha256 }}
        run: |
          set -euo pipefail
          # The tools dir must hold the CLI alone (lunepack PUBLISHING.md: no planted file beside it).
          shopt -s nullglob dotglob; FILES=("$RUNNER_TEMP"/tools/*); shopt -u nullglob dotglob
          if [ "${#FILES[@]}" -ne 1 ] || [ "${FILES[0]}" != "$RUNNER_TEMP/tools/lunepack" ] || [ ! -f "${FILES[0]}" ] || [ -L "${FILES[0]}" ]; then echo "lunepack-cli holds more than the CLI" >&2; exit 1; fi
          GOT="$(sha256sum "$RUNNER_TEMP/tools/lunepack" | cut -d' ' -f1)"
          if [ -z "$WANT" ] || [ "$GOT" != "$WANT" ]; then echo "the CLI is not the one tools-linux built" >&2; exit 1; fi
          chmod +x "$RUNNER_TEMP/tools/lunepack"
      - name: Drop (a dry run first)
        shell: bash
        env:
          DROP_VERSION: ${{ inputs.drop_version }}
          LUNEPACK_RELEASE_KEY: ${{ secrets.LUNEPACK_RELEASE_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          # The push token, for both buckets.
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_PRIVATE_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_PRIVATE_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set +x
          set -euo pipefail
          CLI="$RUNNER_TEMP/tools/lunepack"
          "$CLI" publish drop --version "$DROP_VERSION" --sign release --config packaging/lunepack.toml --dry-run
          if [ "$DRY_RUN" = "true" ]; then
            echo "dry run: nothing dropped"
            exit 0
          fi
          "$CLI" publish drop --version "$DROP_VERSION" --sign release --config packaging/lunepack.toml
